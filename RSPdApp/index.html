<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPS Game</title>
    <link rel="stylesheet" href="style.css">
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.8.0/ethers.umd.min.js"
      type="application/javascript">
    </script>
</head>
<body>
    <header>
        <h1>Rock Paper Scissors</h1>
        <p>A teaching demo on BNB Smart Chain Testnet. Use only testnet tokens.</p>
    </header>

    <div class="score-board">
        <div id="user-label" class="badge">User</div>
        <div id="computer-label" class="badge">Computer</div>
        <span id="user-score">0</span>:<span id="computer-score">0</span>    
    </div>

    <div class="result" aria-live="polite">
        <p>Good luck!</p>
    </div>

    <div class="choices">

        <button type="button" class="choice" id="0">
            <img src="images/R.png" alt="Rock">
        </button>

        <button type="button" class="choice" id="1">
            <img src="images/S.png" alt="Scissors">
        </button>

        <button type="button" class="choice" id="2">
            <img src="images/P.png" alt="Paper">
        </button>

    </div>
    
    <p id="action-msg2">Make a move and confirm it in your wallet. A pending transaction is not a failed move.</p>
    <p id="action-msg" role="status">Make your move</p>
    <p id="round-details"><b>Result:</b> <span id="resultLog">—</span></p>

    <script src="newapp.js?v=2" charset="utf-8"></script>
</body>
</html>
